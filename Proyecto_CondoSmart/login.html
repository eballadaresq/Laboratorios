<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="estilos.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <header>
    <img class="logo" src="logo_texto.png" alt="Logo CondoSmart">


</header>

 <nav class="nav-menu">
    <ul class="nav-list">
    
<li class="menu-item"><a href="index.html">Inicio</a>
<li class="menu-item"><a href="login.html">Iniciar Sesión</a>
 <li class="menu-item"><a href="visitantes.html">Visitantes</a>
 <li class="menu-item"><a href="reservas.html">Reservas</a>

 </ul>
</nav>


 <div class="container">
   <h1>Iniciar Sesión</h1>
<p>Por favor, ingrese sus credenciales para continuar.</p>


<section class="formulario">
            
  
    <form >
            
        <div class="login">
    
    <div class="campo">
            
        <div class="mb-3">  
        <label for="Usuario">Usuario:</label>
        <input type="email" id="Usuario" class="form-control" placeholder="Ingrese su correo electrónico" aria-describedby="emailHelp" required >
        <div id="emailHelp" class="form-text">Nunca compartiremos tu correo electrónico con nadie más.</div>
    </div>

        <div class="mb-3">   
        <label for="Contraseña">Contraseña:</label>
        <input type="password" id="Contraseña" class="form-control" minlength="8"  placeholder="Ingrese su contraseña" required>
       
        <input type="checkbox" id="mostrarPassword">
        <label for="mostrarPassword">Mostrar contraseña</label>
    
        <input type="checkbox" id="recordar" class="ms-5">
         <label for="recordar">Recordarme</label>
        </div>                 
    </div>
         </fieldset>

          <button class="btn-reserva" type="submit">Iniciar Sesión
             </button>
        </fieldset>

        </div>  

      </div>
      
      
      
    </form>

</div>

</section>
<footer>
    <p>&copy; 2026 Plataforma CondoSmart</p>
    <p>Contacto: <a href="mailto:info@condosmart.com">info@condosmart.com</a></p>
  </footer>


  <script>
document.getElementById("mostrarPassword").addEventListener("change", function() {

    let password = document.getElementById("Contraseña");

    if (this.checked) {
        password.type = "text";
    } else {
        password.type = "password";
    }

});
</script>
</body>
</html>
